[project]
name = "appsageai-backend"
version = "2.0.0"
description = "Privacy-first resume analysis API backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # FastAPI and core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    # Firebase & Google Cloud
    "firebase-admin>=6.5.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-secret-manager>=2.20.0",
    # LangChain and AI
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.3.0",
    "langchain-huggingface>=0.3.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    # Document processing
    "pypdf>=4.0.0",
    "PyPDF2>=3.0.0",
    # Monitoring (Privacy mode)
    "langfuse>=2.0.0",
    # Security & Encryption
    "cryptography>=43.0.0",
    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-dateutil>=2.9.0",
    "pytest>=8.4.2",
    "pytest-env>=1.1.5",
    "pytest-cov>=7.0.0",
    "langchain-google-genai>=2.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
