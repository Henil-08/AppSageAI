name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: appsageai-472321
  SERVICE_NAME: appsageai-backend
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker "us-central1-docker.pkg.dev"

    - name: Build Docker image
      run: |
        docker build -t "us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
          -t us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:latest \
          ./backend

    - name: Push to Artifact Registry
      run: |
        docker push "us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars="ENVIRONMENT=production" \
          --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }}" \
          --set-env-vars="FIRESTORE_DATABASE=appsageai" \
          --set-env-vars="GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
          --set-env-vars="ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" \
          --set-env-vars="JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
          --set-env-vars="JWT_ALGORITHM=HS256" \
          --set-env-vars="ACCESS_TOKEN_EXPIRE_MINUTES=60" \
          --set-env-vars="REFRESH_TOKEN_EXPIRE_DAYS=30" \
          --set-env-vars="CORS_ORIGINS=[\"https://appsageai.com\",\"https://www.appsageai.com\"]" \
          --set-env-vars='ALLOWED_FILE_TYPES=["pdf"]' \
          --set-env-vars='MODEL_NAME=llama-3.3-70b-versatile' \
          --set-env-vars="EMBEDDING_MODEL=all-MiniLM-L6-v2" \
          --set-env-vars="HF_TOKEN=${{ secrets.HF_TOKEN }}" \
          --set-env-vars="RATE_LIMIT_ENABLED=true" \
          --set-env-vars="RATE_LIMIT_REQUESTS=100" \
          --set-env-vars="RATE_LIMIT_PERIOD=60" \
          --set-env-vars="MAX_FILE_SIZE_MB=10" \
          --set-env-vars="CHUNK_SIZE=1000" \
          --set-env-vars="CHUNK_OVERLAP=200" \
          --set-env-vars="DEBUG=false" \
          --memory=1Gi \
          --cpu=1 \
          --timeout=300 \
          --max-instances=10

    - name: Get Service URL
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region ${{ env.REGION }} \
          --format 'value(status.url)')
        echo "Backend deployed to: $SERVICE_URL"
        echo "BACKEND_URL=$SERVICE_URL" >> $GITHUB_ENV